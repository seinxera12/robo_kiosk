# Production compose for the backend-only deployment. The dev source bind-mount
# lives in docker-compose.override.yml (auto-loaded for local dev only).
#
# Host ports and the GPU index are env-driven so this file needs no edits to
# coexist with other services on a shared server. Defaults preserve prior values.
# Override in .env, e.g.  SERVER_PORT_HOST=9765  GPU_DEVICE_IDS=1
#
# Ingress: voice-server binds to loopback only by default (SERVER_BIND_HOST) —
# it is meant to be exposed via Tailscale Funnel, not published on a public NIC.
# Point a funnel at it:  tailscale funnel --bg --https=8443 http://127.0.0.1:8765

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Main voice server - handles STT, LLM orchestration, TTS, RAG
  voice-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: voice-server
    ports:
      # Bind to loopback by default (funnel-only ingress). Set SERVER_BIND_HOST=0.0.0.0
      # to publish on all interfaces instead.
      - "${SERVER_BIND_HOST:-127.0.0.1}:${SERVER_PORT_HOST:-8765}:8765"  # WS + health
    volumes:
      - ./models:/models:ro  # Read-only model weights
      - ./building_kb:/building_kb:ro  # Read-only knowledge base
      - ./chroma_data:/chroma  # Persistent ChromaDB storage
      - ./voices_reference:/voices_reference:ro  # KokoClone reference audio
      # HuggingFace cache. WITHOUT THIS, models land in ~/.cache inside the
      # container's writable layer and are destroyed on every recreate, so each
      # `docker compose up` re-downloads them: multilingual-e5-large (~2.2 GB,
      # the RAG embedder) plus Kokoro-82M. That is the several-minute stall
      # before the app starts. With the volume, it is a one-time cost.
      - hf_cache:/hf_cache
    environment:
      # Point every HuggingFace library at the persistent cache above.
      # HF_HOME covers huggingface_hub (Kokoro's KPipeline downloads via it);
      # SENTENCE_TRANSFORMERS_HOME covers sentence-transformers (the embedder).
      # Both must be set — they do not read each other's variable.
      - HF_HOME=/hf_cache
      - SENTENCE_TRANSFORMERS_HOME=/hf_cache/sentence-transformers
      # vLLM configuration (primary LLM backend).
      # Routes to an EXISTING inference endpoint (LiteLLM proxy) already running
      # on the server — no vLLM container/model is deployed by this stack.
      # VLLM_BASE_URL must end in /v1 and point at the proxy (service DNS name on
      # the shared external network, e.g. http://litellm:4000/v1).
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://litellm:4000/v1}
      - VLLM_MODEL_NAME=${VLLM_MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      - VLLM_API_KEY=${VLLM_API_KEY:-local}

      # Ollama configuration (secondary LLM backend)
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL_NAME=${OLLAMA_MODEL_NAME:-qwen2.5:7b-instruct}

      # STT configuration.
      # STT_BACKEND=remote routes to the existing faster-whisper service on the
      # shared network (no in-process model / VRAM). STT_MODEL/COMPUTE/DEVICE
      # only apply to the local backend.
      - STT_BACKEND=${STT_BACKEND:-local}
      - STT_REMOTE_URL=${STT_REMOTE_URL:-http://stt-fastwhisper:8000/v1/audio/transcriptions}
      - STT_MODEL=${STT_MODEL:-large-v3}
      - STT_COMPUTE_TYPE=${STT_COMPUTE_TYPE:-int8}
      - STT_DEVICE=${STT_DEVICE:-cuda}

      # TTS configuration
      # English: Kokoro-82M (in-process). Japanese: KokoClone microservice or Kokoro JP.
      - KOKOCLONE_URL=${KOKOCLONE_URL:-http://localhost:5003}
      - KOKOCLONE_ENABLED=${KOKOCLONE_ENABLED:-false}
      - KOKOCLONE_REF_AUDIO=${KOKOCLONE_REF_AUDIO:-/voices_reference/ref.wav}
      - KOKORO_DEVICE=${KOKORO_DEVICE:-cpu}

      # RAG configuration
      - CHROMADB_PATH=/chroma
      - USE_RAG=${USE_RAG:-true}
      - BUILDING_NAME=${BUILDING_NAME:-Office Building}

      # SearXNG configuration
      - SEARXNG_URL=http://searxng:8080

      # NOTE: the search query reformulator has no config of its own. It runs on
      # the SAME endpoint/model as the main chat LLM (VLLM_BASE_URL /
      # VLLM_MODEL_NAME above), so there is no second model to host or keep warm.
      # The old REFORMULATOR_MODEL var (a separate small Ollama model) is gone.

      # CORS — comma-separated origins; "*" for open kiosk access
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}

      # Server port (bind inside container)
      - SERVER_PORT=8765

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_IDS:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    depends_on:
      ollama:
        condition: service_started
      searxng:
        condition: service_started
    networks:
      - voice-network
      - shared-infra     # existing network hosting LiteLLM proxy + faster-whisper
    logging: *default-logging
    restart: unless-stopped

  # NOTE: no vLLM or faster-whisper service here — LLM inference and (optionally)
  # STT are served by EXISTING endpoints already running on the server.
  # voice-server reaches them over the external `shared-infra` network via
  # VLLM_BASE_URL / STT_REMOTE_URL. Nothing to build or pull for either.

  # Ollama - Secondary LLM inference engine (CPU/GPU fallback)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "${OLLAMA_PORT_HOST:-11434}:11434"
    volumes:
      - ./models/ollama:/root/.ollama
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - voice-network
    logging: *default-logging
    restart: unless-stopped
    # Note: Ollama can use GPU if available, but also works on CPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_IDS:-0}"]
              capabilities: [gpu]

  # SearXNG - Self-hosted web search service
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "${SEARXNG_PORT_HOST:-8081}:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-changeme}
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4
    networks:
      - voice-network
    depends_on:
      - searxng-redis
    logging: *default-logging
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE

  searxng-redis:
    image: redis:alpine
    container_name: searxng-redis
    command: redis-server --save "" --appendonly no
    networks:
      - voice-network
    logging: *default-logging
    restart: unless-stopped

networks:
  voice-network:
    driver: bridge
  # External network the existing LiteLLM proxy AND faster-whisper containers are
  # attached to (qfind-net per the server compose). Set SHARED_INFRA_NETWORK to
  # its actual name (find via `docker network ls`). NOT created by this stack —
  # it must already exist on the server.
  shared-infra:
    external: true
    name: ${SHARED_INFRA_NETWORK:-qfind-net}

volumes:
  ollama_data:
    driver: local
  # Persistent HuggingFace model cache for voice-server (RAG embedder + Kokoro).
  # Survives container recreation, so models download once rather than on every
  # `docker compose up`. Safe to delete to force a re-download.
  hf_cache:
    driver: local
