# Development overrides — auto-loaded by `docker compose` on top of
# docker-compose.yml for LOCAL development only.
#
# Do NOT deploy this file to the server (it re-introduces a host source
# bind-mount, which would let on-disk edits diverge from the built image).
# It is excluded from the deploy branch / build context.
services:
  voice-server:
    volumes:
      # Mount source for hot-reload during local development. Overlays the code
      # baked into the image at /app/server.
      - ./server:/app/server
